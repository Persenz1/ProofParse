[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofparse"
version = "0.3.0.dev0"
description = "Local-first research PDF -> Markdown: text-layer prose, swappable layout/formula models in isolated workers, cross-checked formulas, agent/API escalation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# The main process needs only these; model engines run in their own environments.
dependencies = [
    "pymupdf>=1.24",
    "pypdfium2>=4",
    "pillow",
]

[project.optional-dependencies]
fontnames = ["fonttools>=4"]
test = ["pytest"]

[project.scripts]
proofparse = "proofparse.cli:main"

[tool.setuptools.packages.find]
include = ["proofparse*"]
