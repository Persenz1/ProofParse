[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofparse"
version = "0.1.0"
description = "Local-first research PDF -> Markdown pipeline with a three-layer QC funnel (MinerU + deterministic checks + formula double-check + multimodal final review)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4",
    "pypdfium2>=4",
]

[project.optional-dependencies]
# Layer 2 公式双识别（GPU 推荐）；MinerU 本体请按 README 安装 mineru[pipeline]
formula = ["torch", "transformers>=4.45", "pillow"]

[project.scripts]
proofparse = "proofparse.cli:main"
proofparse-review = "proofparse.review.review:main"

[tool.setuptools.packages.find]
include = ["proofparse*"]
